<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>penpal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #0f0e17;
  font-family: 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  overflow: hidden;
  color: #f5e8d0;
}
#app { width: 100%; height: 100%; display: flex; flex-direction: column; }

/* ---- login ---- */
#login { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1.5rem; }
#login h1 { font-size: 3rem; font-weight: 300; color: rgba(245,232,208,0.25); letter-spacing: 0.15em; margin-bottom: 0.5rem; }
#login .pick { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
#login .pick button {
  font-size: 1.3rem; font-weight: 600; padding: 0.8rem 1.8rem;
  border: none; border-radius: 0.8rem; cursor: pointer; outline: none;
  background: radial-gradient(circle at 35% 35%, rgba(245,232,208,0.12), transparent);
  color: #f5e8d0; transition: background 0.2s ease, transform 0.15s ease;
}
#login .pick button:hover { background: radial-gradient(circle at 35% 35%, rgba(245,232,208,0.25), transparent); transform: scale(1.06); }

/* ---- top bar ---- */
#top { display: none; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; background: rgba(15,14,23,0.8); }
#top .back { font-size: 1.2rem; border: none; background: none; cursor: pointer; color: rgba(245,232,208,0.5); padding: 0.2rem 0.6rem; border-radius: 0.4rem; }
#top .back:hover { color: #f5e8d0; background: rgba(245,232,208,0.08); }
#top .user { font-size: 0.85rem; color: rgba(245,232,208,0.4); letter-spacing: 0.05em; }

/* ---- inbox ---- */
#inbox { display: none; flex-direction: column; height: 100%; }
#inbox-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
.msg-card {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.7rem 1rem; margin: 0.3rem 0;
  border-radius: 0.6rem; cursor: pointer;
  transition: background 0.15s ease;
  background: rgba(245,232,208,0.03);
}
.msg-card:hover { background: rgba(245,232,208,0.08); }
.msg-card .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; }
.msg-card .dot.unread { background: #7dd4d0; }
.msg-card .from { font-size: 0.9rem; font-weight: 600; color: #f5e8d0; min-width: 4rem; }
.msg-card .subj { font-size: 0.85rem; color: rgba(245,232,208,0.65); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-card .time { font-size: 0.7rem; color: rgba(245,232,208,0.3); white-space: nowrap; }
#inbox-empty {
  display: flex; align-items: center; justify-content: center; height: 100%;
  font-size: 1.2rem; color: rgba(245,232,208,0.25);
}
#inbox-empty span { font-size: 2.5rem; opacity: 0.3; }
#compose-btn {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  width: 2.8rem; height: 2.8rem; border-radius: 50%; border: none;
  font-size: 1.4rem; cursor: pointer; outline: none;
  background: radial-gradient(circle at 35% 35%, rgba(125,212,208,0.5), rgba(125,212,208,0.05));
  box-shadow: 0 0 0.6rem rgba(125,212,208,0.25);
  transition: transform 0.15s ease;
}
#compose-btn:hover { transform: scale(1.15); }
#compose-btn:active { transform: scale(0.9); }

/* ---- compose ---- */
#compose { display: none; flex-direction: column; height: 100%; }
#compose-form { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.5rem 1rem; background: rgba(15,14,23,0.5); }
#compose-form label { font-size: 0.75rem; color: rgba(245,232,208,0.35); text-transform: uppercase; letter-spacing: 0.1em; }
#compose-form select, #compose-form input {
  font-size: 0.9rem; padding: 0.35rem 0.6rem; border: none; border-radius: 0.4rem;
  background: rgba(245,232,208,0.06); color: #f5e8d0; outline: none;
  font-family: inherit;
}
#compose-body-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 0.5em;
}
#compose-display {
  display: block; max-width: 100%; white-space: normal; word-break: normal;
  overflow-wrap: normal; font-size: 160px; font-weight: 700; line-height: 1.15;
  text-align: center; color: #f5e8d0;
}
#compose-tools {
  display: flex; align-items: center; justify-content: center; gap: 0.8rem;
  padding: 0.3rem; position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
}
#compose-tools button {
  width: 2.5rem; height: 2.5rem; border-radius: 50%; border: none;
  cursor: pointer; outline: none; font-size: 1.2rem;
  background: radial-gradient(circle at 35% 35%, rgba(245,232,208,0.2), transparent);
  transition: transform 0.15s ease;
}
#compose-tools button:hover { transform: scale(1.15); }
#compose-tools button:active { transform: scale(0.9); }
#send-btn {
  font-size: 0.85rem !important; font-weight: 600; text-transform: uppercase;
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  width: auto; height: auto; padding: 0.5rem 1rem;
  border-radius: 1.5rem; background: radial-gradient(circle at 35% 35%, rgba(125,212,208,0.5), rgba(125,212,208,0.05));
}
#compose-emoji-picker {
  position: fixed; bottom: 4.5rem; left: 50%; transform: translateX(-50%);
  display: none; flex-wrap: wrap; gap: 0.3rem; padding: 0.6rem;
  background: rgba(15,14,23,0.88); border-radius: 1rem; max-height: 10rem; overflow-y: auto; z-index: 10;
}
.emoji-opt { font-size: 1.5rem; cursor: pointer; padding: 0.2rem 0.3rem; border-radius: 0.3rem; transition: transform 0.1s; line-height: 1; }
.emoji-opt:hover { background: rgba(245,232,208,0.15); transform: scale(1.3); }

/* ---- read ---- */
#read { display: none; flex-direction: column; height: 100%; }
#read-header { padding: 0.5rem 1rem; background: rgba(15,14,23,0.5); }
#read-header .label { font-size: 0.7rem; color: rgba(245,232,208,0.3); text-transform: uppercase; letter-spacing: 0.08em; }
#read-header .val { font-size: 1rem; font-weight: 500; margin-bottom: 0.15rem; }
#read-body {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 0.5em;
}
#read-display {
  display: block; max-width: 100%; white-space: normal; word-break: normal;
  overflow-wrap: normal; font-size: 160px; font-weight: 700; line-height: 1.15;
  text-align: center; color: #f5e8d0;
}
</style>
</head>
<body>
<div id="app">

<!-- login -->
<div id="login">
  <h1>penpal</h1>
  <div class="pick" id="user-list"></div>
</div>

<!-- top bar -->
<div id="top">
  <button class="back" id="top-back">←</button>
  <span class="user" id="top-user"></span>
</div>

<!-- inbox -->
<div id="inbox">
  <div id="inbox-list"></div>
  <div id="inbox-empty"><span>📭</span> &nbsp; no messages yet</div>
  <button id="compose-btn">✏️</button>
</div>

<!-- compose -->
<div id="compose">
  <div id="compose-form">
    <label>to</label>
    <select id="compose-to"></select>
    <label>subject</label>
    <input id="compose-subj" placeholder="what's it about?" maxlength="60">
  </div>
  <div id="compose-body-area">
    <div id="compose-display"><span id="compose-letters"></span></div>
  </div>
  <div id="compose-emoji-picker"></div>
  <button id="send-btn">send</button>
  <div id="compose-tools">
    <button id="emoji-pick-btn">😊</button>
  </div>
</div>

<!-- read -->
<div id="read">
  <div id="read-header"></div>
  <div id="read-body">
    <div id="read-display"></div>
  </div>
</div>

</div>

<script>
// ---- config ----
const FAMILY = ['Dad', 'Mom', 'Kid1', 'Kid2', 'Kid3'];
const MSG_KEY = 'penpal.messages';
const USER_KEY = 'penpal.current';

// ---- load/save ----
function loadMessages() {
  try { return JSON.parse(localStorage.getItem(MSG_KEY)) || []; } catch(e) { return []; }
}
function saveMessages(msgs) {
  localStorage.setItem(MSG_KEY, JSON.stringify(msgs));
}
function getInbox(user) {
  return loadMessages().filter(m => m.to === user).sort((a,b) => b.time - a.time);
}
function randId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6); }

// ---- screens ----
let curUser = null;
let composeBody = '';
let composeBodyCount = 0;

function show(s) {
  ['login','top','inbox','compose','read'].forEach(id => {
    const el = document.getElementById(id);
    el.style.display = (id === s || (id === 'top' && s !== 'login')) ? '' : 'none';
  });
}

// ---- login ----
function buildLogin() {
  const list = document.getElementById('user-list');
  FAMILY.forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', () => selectUser(name));
    list.appendChild(b);
  });
}
function selectUser(name) {
  curUser = name;
  localStorage.setItem(USER_KEY, name);
  document.getElementById('top-user').textContent = name;
  show('inbox');
  renderInbox();
}

// ---- inbox ----
function renderInbox() {
  const msgs = getInbox(curUser);
  const list = document.getElementById('inbox-list');
  const empty = document.getElementById('inbox-empty');
  list.innerHTML = '';
  if (!msgs.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  msgs.forEach(m => {
    const card = document.createElement('div');
    card.classList.add('msg-card');
    const dot = document.createElement('span');
    dot.classList.add('dot', m.read ? 'read' : 'unread');
    const from = document.createElement('span');
    from.classList.add('from'); from.textContent = m.from;
    const subj = document.createElement('span');
    subj.classList.add('subj'); subj.textContent = m.subj || '(no subject)';
    const time = document.createElement('span');
    time.classList.add('time');
    const d = new Date(m.time);
    time.textContent = d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
    card.append(dot, from, subj, time);
    card.addEventListener('click', () => openRead(m.id));
    list.appendChild(card);
  });
}
function startCompose() {
  const sel = document.getElementById('compose-to');
  sel.innerHTML = '';
  FAMILY.filter(n => n !== curUser).forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
  document.getElementById('compose-subj').value = '';
  document.getElementById('compose-letters').innerHTML = '';
  composeBody = ''; composeBodyCount = 0;
  show('compose');
}

// ---- compose (letterbox engine) ----
const PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
    catch(e) {}
  }
}
function synthBuffer(freq, vol, dur, wave, label) {
  if (!audioCtx) return;
  try { if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e) {}
  try {
    const sr = audioCtx.sampleRate, n = Math.round(Math.max(sr*dur,200));
    const buf = audioCtx.createBuffer(1,n,sr), data = buf.getChannelData(0);
    for (let i=0; i<n; i++) {
      const a = 2*Math.PI*freq*i/sr;
      let s = wave==='triangle'?Math.asin(Math.sin(a))*2/Math.PI:wave==='square'?Math.sin(a)>0?1:-1:Math.sin(a);
      data[i] = s*vol*(1-i/n);
    }
    let src;
    try { src = audioCtx.createBufferSource(); }
    catch(e1) { try { src = new (window.AudioBufferSourceNode||window.BufferSourceNode)(audioCtx); } catch(e2) { return; } }
    src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
  } catch(e) {}
}
function playNote(i) { synthBuffer(PENTA[i%PENTA.length], 0.20, 0.25, 'sine', 'note'); }
function playAccent(ch) {
  const u = ch.toUpperCase();
  if ('AEIOU'.includes(u)) synthBuffer(1200, 0.22, 0.08, 'triangle', 'vowel');
  else if (u>='A'&&u<='Z') synthBuffer(160, 0.26, 0.06, 'square', 'cons');
  else if (u>='0'&&u<='9') synthBuffer(55, 0.32, 0.12, 'sine', 'num');
  else synthBuffer(900, 0.12, 0.03, 'triangle', 'other');
}
function addComposeChar(ch) {
  initAudio();
  const letters = document.getElementById('compose-letters');
  const s = document.createElement('span');
  s.classList.add('letter');
  s.textContent = ch;
  letters.appendChild(s);
  void s.offsetWidth;
  s.classList.add('pop');
  composeBody += ch;
  composeBodyCount++;
  playNote(composeBodyCount-1);
  playAccent(ch);
}
function addComposeSpace() {
  const letters = document.getElementById('compose-letters');
  const s = document.createElement('span');
  s.classList.add('letter', 'space');
  s.innerHTML = '&nbsp;';
  letters.appendChild(s);
  composeBody += ' ';
  composeBodyCount++;
}
function sendMessage() {
  const to = document.getElementById('compose-to').value;
  const subj = document.getElementById('compose-subj').value.trim();
  if (!composeBody.trim()) return;
  const msg = { id: randId(), from: curUser, to, subj, body: composeBody, time: Date.now(), read: false };
  const msgs = loadMessages();
  msgs.push(msg);
  saveMessages(msgs);
  show('inbox');
  renderInbox();
}
function openRead(id) {
  const msgs = loadMessages();
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  if (!m.read) { m.read = true; saveMessages(msgs); }
  const h = document.getElementById('read-header');
  h.innerHTML = '';
  const rows = [['from', m.from], ['to', m.to], ['subject', m.subj||'(no subject)']];
  rows.forEach(r => {
    const d = document.createElement('div');
    const lbl = document.createElement('span'); lbl.classList.add('label'); lbl.textContent = r[0];
    const val = document.createElement('div'); val.classList.add('val'); val.textContent = r[1];
    d.append(lbl, val); h.appendChild(d);
  });
  // Render body with big letters
  const disp = document.getElementById('read-display');
  disp.innerHTML = '';
  for (const ch of m.body) {
    const s = document.createElement('span');
    s.classList.add('letter');
    if (ch === ' ') { s.classList.add('space'); s.innerHTML = '&nbsp;'; }
    else s.textContent = ch;
    disp.appendChild(s);
  }
  show('read');
  renderInbox(); // update unread dots
}

// ---- compose emoji picker ----
const EMOJI_SET = ['🐶','🐱','🐼','🐨','🐸','🦊','🐰','🐻','🐧','🐔','🌸','🌺','⭐','🌈','🎈','🍎','🍕','🍦','🍩','🎁','🎯','🦋','🐝','✨','🔥','👋'];
let emojiPickerBuilt = false;
function toggleComposeEmoji() {
  const p = document.getElementById('compose-emoji-picker');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  if (!emojiPickerBuilt) {
    emojiPickerBuilt = true;
    EMOJI_SET.forEach(e => {
      const s = document.createElement('span');
      s.classList.add('emoji-opt'); s.textContent = e;
      s.addEventListener('click', () => { addComposeChar(e); toggleComposeEmoji(); });
      p.appendChild(s);
    });
  }
}

// ---- keyboard ----
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  // Only handle when composing
  if (document.getElementById('compose').style.display !== 'none') {
    if (k === 'Backspace') { /* simple backspace */ e.preventDefault(); return; }
    if (k === 'Escape') { show('inbox'); e.preventDefault(); return; }
    if (k === 'Enter') { sendMessage(); e.preventDefault(); return; }
    if (k === ' ') { addComposeSpace(); e.preventDefault(); return; }
    if (k.length === 1) { addComposeChar(k.toUpperCase()); e.preventDefault(); }
  }
});

// ---- init ----
buildLogin();
const saved = localStorage.getItem(USER_KEY);
if (saved && FAMILY.includes(saved)) { selectUser(saved); }
else { show('login'); }

// wire top back
document.getElementById('top-back').addEventListener('click', () => {
  if (document.getElementById('compose').style.display !== 'none') show('inbox');
  else if (document.getElementById('read').style.display !== 'none') { show('inbox'); renderInbox(); }
});
document.getElementById('compose-btn').addEventListener('click', startCompose);
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('emoji-pick-btn').addEventListener('click', toggleComposeEmoji);
document.addEventListener('mousedown', () => document.body.focus());
document.body.focus();
document.body.tabIndex = 0;
</script>
<style>
.letter { display: inline-block; will-change: transform; text-shadow: 0 0 0.05em rgba(255,220,180,0.15); }
.letter.pop { animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes pop-in {
  0%{transform:scale(0) translateY(0.12em);opacity:0;filter:brightness(3)}
  50%{transform:scale(1.18) translateY(-0.02em);opacity:1;filter:brightness(1.2)}
  100%{transform:scale(1) translateY(0);opacity:1;filter:brightness(1)}
}
.letter.space { width: 0.35em; display: inline-block; animation: none; }
</style>
</body>
</html>
